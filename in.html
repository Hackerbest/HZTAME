<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAPEEPHAT</title>
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      color-scheme: dark;
      --text: #f8fafc;
      --soft: rgba(248, 250, 252, 0.72);
      --glass: rgba(9, 22, 28, 0.34);
      --line: rgba(255, 255, 255, 0.22);
      --accent: #7dd3fc;
      --accent-2: #86efac;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      color: var(--text);
      font-family: "Segoe UI", "Noto Sans Thai", Tahoma, sans-serif;
      background: #061114;
    }

    .bg-video,
    .bg-fallback,
    .shade {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .bg-video {
      object-fit: cover;
      z-index: -3;
      filter: saturate(1.08) contrast(1.04);
    }

    .bg-fallback {
      z-index: -4;
      background:
        linear-gradient(115deg, rgba(10, 70, 64, 0.8), rgba(5, 18, 28, 0.88)),
        url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1800&q=80") center / cover;
    }

    .shade {
      z-index: -2;
      background:
        linear-gradient(to bottom, rgba(0, 0, 0, 0.26), rgba(0, 0, 0, 0.48)),
        radial-gradient(circle at 50% 42%, rgba(125, 211, 252, 0.14), transparent 34%);
    }

    .enter-screen {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      color: var(--text);
      font-size: 30px;
      font-weight: 800;
      text-shadow: 0 0 18px rgba(255, 255, 255, 0.76);
      background: rgba(0, 0, 0, 0.48);
      backdrop-filter: blur(10px);
      cursor: pointer;
      transition: opacity 260ms ease, visibility 260ms ease;
    }

    body.entered .enter-screen {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .snow {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }

    .snow span {
      position: absolute;
      top: -10vh;
      left: var(--x);
      color: rgba(255, 255, 255, 0.86);
      font-size: var(--size);
      filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.72));
      animation: fall var(--duration) linear infinite;
      animation-delay: var(--delay);
    }

    @keyframes fall {
      to {
        transform: translate3d(var(--drift), 115vh, 0) rotate(1turn);
      }
    }

    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      text-align: center;
    }

    .center {
      width: min(100%, 760px);
      padding: 18px;
      text-align: center;
    }

    h1 {
      position: relative;
      margin: 0;
      width: 100%;
      display: inline-block;
      font-size: clamp(52px, 10vw, 108px);
      line-height: 0.9;
      letter-spacing: 0;
      text-align: center;
      white-space: nowrap;
      color: transparent;
      background:
        linear-gradient(90deg, #ffffff 0%, #b9f6ff 22%, #ffffff 42%, #d9fff0 68%, #ffffff 100%);
      background-size: 220% 100%;
      background-clip: text;
      -webkit-background-clip: text;
      text-shadow:
        0 0 18px rgba(255, 255, 255, 0.86),
        0 8px 34px rgba(0, 0, 0, 0.5);
      animation: titleGlow 3.8s ease-in-out infinite, titleShine 5.5s linear infinite;
    }

    h1::after {
      content: "RAPEEPHAT";
      position: absolute;
      inset: 0;
      color: transparent;
      background: linear-gradient(110deg, transparent 30%, rgba(255, 255, 255, 0.95) 48%, transparent 66%);
      background-size: 240% 100%;
      background-clip: text;
      -webkit-background-clip: text;
      filter: blur(0.4px);
      animation: titleSweep 3.4s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes titleGlow {
      0%,
      100% {
        transform: translateY(0) scale(1);
        filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.55));
      }

      50% {
        transform: translateY(-3px) scale(1.015);
        filter: drop-shadow(0 0 24px rgba(185, 246, 255, 0.86));
      }
    }

    @keyframes titleShine {
      from {
        background-position: 0% 50%;
      }

      to {
        background-position: 220% 50%;
      }
    }

    @keyframes titleSweep {
      0%,
      28% {
        background-position: 180% 50%;
        opacity: 0;
      }

      42% {
        opacity: 1;
      }

      68%,
      100% {
        background-position: -80% 50%;
        opacity: 0;
      }
    }

    .skills {
      max-width: 520px;
      margin: 18px auto 0;
      color: rgba(255, 255, 255, 0.82);
      font-size: clamp(15px, 2.4vw, 19px);
      font-weight: 700;
      line-height: 1.55;
      text-shadow: 0 3px 16px rgba(0, 0, 0, 0.56);
    }

    .links {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-top: 28px;
    }

    .social {
      width: 64px;
      height: 64px;
      display: grid;
      place-items: center;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 50%;
      background: var(--glass);
      backdrop-filter: blur(12px);
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.24);
      transition: transform 180ms ease, border-color 180ms ease, background 180ms ease;
    }

    .social:hover,
    .social:focus-visible {
      transform: translateY(-4px) scale(1.04);
      border-color: rgba(255, 255, 255, 0.56);
      background: rgba(255, 255, 255, 0.18);
      outline: none;
    }

    .social svg {
      width: 31px;
      height: 31px;
      fill: currentColor;
    }

    .player {
      width: min(100%, 520px);
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 14px;
      align-items: center;
      margin: 28px auto 0;
      padding: 10px 12px;
      color: var(--text);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.035);
      backdrop-filter: blur(6px);
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.12);
    }

    .track-icon {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      font-size: 34px;
      line-height: 1;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.8);
    }

    .track-info {
      min-width: 0;
      text-align: left;
    }

    .track-title {
      display: none;
    }

    .timeline {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 8px;
      align-items: center;
      color: rgba(255, 255, 255, 0.78);
      font-size: 14px;
      font-variant-numeric: tabular-nums;
    }

    .progress {
      width: 100%;
      height: 3px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.42);
    }

    .progress span {
      display: block;
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: #ffffff;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.86);
    }

    .player-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      color: var(--text);
      background: transparent;
      cursor: pointer;
      opacity: 0.9;
      transition: transform 160ms ease, opacity 160ms ease, background 160ms ease;
    }

    button:hover,
    button:focus-visible {
      transform: scale(1.08);
      opacity: 1;
      background: rgba(255, 255, 255, 0.14);
      outline: none;
    }

    button svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    button svg[hidden] {
      display: none;
    }

    #toggleMusic .pause-icon {
      display: none;
    }

    #toggleMusic .play-icon {
      display: block;
    }

    #toggleMusic.is-playing .pause-icon {
      display: block;
    }

    #toggleMusic.is-playing .play-icon {
      display: none;
    }

    .status {
      display: none;
    }

    .volume {
      width: min(100%, 210px);
      margin: 14px auto 0;
      accent-color: var(--text);
    }

    @media (max-width: 520px) {
      .center {
        padding-inline: 0;
      }

      h1 {
        font-size: clamp(44px, 16vw, 72px);
      }

      .social {
        width: 58px;
        height: 58px;
      }

      .player {
        grid-template-columns: 1fr;
        justify-items: center;
      }

      .track-info {
        width: 100%;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <div class="bg-fallback" aria-hidden="true"></div>
  <video class="bg-video" autoplay muted loop playsinline poster="h+" aria-hidden="true">
    <source src="https://cdn.pixabay.com/video/2023/10/17/185451-875362711_large.mp4" type="video/mp4" />
  </video>
  <div class="shade" aria-hidden="true"></div>
  <div class="snow" aria-hidden="true">
    <span style="--x:8%;--size:18px;--duration:12s;--delay:-1s;--drift:22px">*</span>
    <span style="--x:17%;--size:13px;--duration:15s;--delay:-8s;--drift:-32px">*</span>
    <span style="--x:28%;--size:20px;--duration:13s;--delay:-5s;--drift:26px">*</span>
    <span style="--x:39%;--size:12px;--duration:17s;--delay:-10s;--drift:-24px">*</span>
    <span style="--x:52%;--size:16px;--duration:14s;--delay:-3s;--drift:34px">*</span>
    <span style="--x:64%;--size:21px;--duration:16s;--delay:-7s;--drift:-28px">*</span>
    <span style="--x:76%;--size:14px;--duration:11s;--delay:-4s;--drift:24px">*</span>
    <span style="--x:88%;--size:19px;--duration:18s;--delay:-11s;--drift:-30px">*</span>
  </div>
  <div class="enter-screen" id="enterScreen">click to enter...</div>

  <main>
    <section class="center" aria-label="RAPEEPHAT profile links">
      <h1>RAPEEPHAT</h1>
      <p class="skills">ทักษะในการเขียนโค้ด: HTML, CSS, JavaScript, Python, C#, C++ และ Reverse Engineering</p>

      <nav class="links" aria-label="social links">
        <a class="social" href="https://discord.com/users/524543785695313930" target="_blank" rel="noopener noreferrer" aria-label="Discord">
          <svg viewBox="0 0 127.14 96.36" aria-hidden="true">
            <path d="M107.7 8.07A105.15 105.15 0 0 0 81.47 0a72.06 72.06 0 0 0-3.36 6.83 97.68 97.68 0 0 0-29.11 0A72.37 72.37 0 0 0 45.64 0a105.89 105.89 0 0 0-26.25 8.09C2.79 32.65-1.71 56.6.54 80.21A105.73 105.73 0 0 0 32.71 96.36a77.7 77.7 0 0 0 6.89-11.11 68.42 68.42 0 0 1-10.85-5.18c.91-.66 1.8-1.34 2.66-2.03a75.57 75.57 0 0 0 64.32 0c.87.71 1.76 1.39 2.66 2.03a68.68 68.68 0 0 1-10.87 5.19 77 77 0 0 0 6.89 11.1 105.25 105.25 0 0 0 32.19-16.14c2.64-27.38-4.51-51.11-18.9-72.15ZM42.45 65.69c-6.29 0-11.45-5.76-11.45-12.84s5.05-12.85 11.45-12.85c6.44 0 11.56 5.8 11.45 12.85.01 7.08-5.05 12.84-11.45 12.84Zm42.24 0c-6.29 0-11.45-5.76-11.45-12.84S78.29 40 84.69 40c6.44 0 11.56 5.8 11.45 12.85 0 7.08-5.01 12.84-11.45 12.84Z" />
          </svg>
        </a>
        <a class="social" href="https://www.tiktok.com/@rapeephatremix" target="_blank" rel="noopener noreferrer" aria-label="TikTok">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64c.3 0 .59.05.86.14V9.4a6.33 6.33 0 0 0-1-.08A6.34 6.34 0 0 0 5 20.3a6.34 6.34 0 0 0 10.86-4.43V8.56a8.16 8.16 0 0 0 4.77 1.52V6.76c-.35 0-.7-.03-1.04-.07Z" />
          </svg>
        </a>
        <a class="social" href="https://www.youtube.com/@DjRapeephatRemix" target="_blank" rel="noopener noreferrer" aria-label="YouTube">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31.4 31.4 0 0 0 0 12a31.4 31.4 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31.4 31.4 0 0 0 24 12a31.4 31.4 0 0 0-.5-5.8ZM9.6 15.6V8.4L15.8 12Z" />
          </svg>
        </a>
      </nav>

      <div class="player" aria-label="music player">
        <div class="track-icon" aria-hidden="true">♫</div>
        <div class="track-info">
          <div class="track-title" id="trackTitle">Hz001</div>
          <div class="timeline">
            <span id="currentTime">0:00</span>
            <div class="progress" aria-hidden="true"><span id="progressFill"></span></div>
            <span id="totalTime">0:00</span>
          </div>
        </div>
        <div class="player-actions">
          <button id="previousMusic" type="button" aria-label="previous music">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 7v10l-7-5Zm9 0v10h-3V7Zm-4 0v10l-7-5Z" /></svg>
          </button>
          <button id="toggleMusic" type="button" aria-label="pause music">
            <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5h3v14H8Zm5 0h3v14h-3Z" /></svg>
            <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M8 5v14l11-7Z" /></svg>
          </button>
          <button id="stopMusic" type="button" aria-label="stop music">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v10H7Z" /></svg>
          </button>
          <button id="nextMusic" type="button" aria-label="next music">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 7v10l7-5Zm-9 0v10h3V7Zm4 0v10l7-5Z" /></svg>
          </button>
        </div>
      </div>
      <input class="volume" id="volumeControl" type="range" min="0" max="100" value="100" aria-label="volume" />
      <p class="status" id="musicStatus">คลิกเพื่อเข้าและเปิดเพลง</p>
      <audio id="audioPlayer" preload="auto"></audio>
    </section>
  </main>

  <script>
    const enterScreen = document.getElementById("enterScreen");
    const audioPlayer = document.getElementById("audioPlayer");
    const previousButton = document.getElementById("previousMusic");
    const toggleButton = document.getElementById("toggleMusic");
    const stopButton = document.getElementById("stopMusic");
    const nextButton = document.getElementById("nextMusic");
    const volumeControl = document.getElementById("volumeControl");
    const statusText = document.getElementById("musicStatus");
    const trackTitle = document.getElementById("trackTitle");
    const currentTimeText = document.getElementById("currentTime");
    const totalTimeText = document.getElementById("totalTime");
    const progressFill = document.getElementById("progressFill");
    const pauseIcon = toggleButton.querySelector(".pause-icon");
    const playIcon = toggleButton.querySelector(".play-icon");

    const playlist = [
      { title: "Hz001", src: "Hz001.wav" }
    ];

    let trackIndex = 0;
    let hasEntered = false;

    function getVolume() {
      return Number(volumeControl.value) / 100;
    }

    function formatTime(seconds) {
      const minutes = Math.floor(seconds / 60);
      const remainingSeconds = Math.floor(seconds % 60).toString().padStart(2, "0");
      return `${minutes}:${remainingSeconds}`;
    }

    function loadTrack(index, shouldPlay = false) {
      trackIndex = (index + playlist.length) % playlist.length;
      const track = playlist[trackIndex];
      trackTitle.textContent = track.title;
      audioPlayer.src = track.src;
      audioPlayer.volume = getVolume();
      audioPlayer.load();
      updateProgress();
      updateStatus();

      if (shouldPlay) {
        playMusic();
      }
    }

    function playMusic() {
      audioPlayer.play()
        .then(() => {
          hasEntered = true;
          document.body.classList.add("entered");
          updateStatus();
        })
        .catch(() => {
          statusText.textContent = "แตะหน้าเว็บเพื่อเปิดเพลง";
        });
    }

    function toggleMusic() {
      if (audioPlayer.paused) {
        playMusic();
      } else {
        audioPlayer.pause();
        updateStatus();
      }
    }

    function previousMusic() {
      if (audioPlayer.currentTime > 3 || playlist.length === 1) {
        audioPlayer.currentTime = 0;
        updateProgress();
        if (!audioPlayer.paused) {
          playMusic();
        }
        return;
      }

      loadTrack(trackIndex - 1, hasEntered);
    }

    function nextMusic() {
      loadTrack(trackIndex + 1, hasEntered);
    }

    function stopMusic() {
      audioPlayer.pause();
      audioPlayer.currentTime = 0;
      updateProgress();
      updateStatus();
    }

    function updateProgress() {
      const duration = Number.isFinite(audioPlayer.duration) ? audioPlayer.duration : 0;
      currentTimeText.textContent = formatTime(audioPlayer.currentTime || 0);
      totalTimeText.textContent = duration ? formatTime(duration) : "0:00";
      progressFill.style.width = duration ? `${(audioPlayer.currentTime / duration) * 100}%` : "0%";
    }

    function updateStatus() {
      const isPaused = audioPlayer.paused;
      toggleButton.classList.toggle("is-playing", !isPaused);
      pauseIcon.hidden = isPaused;
      playIcon.hidden = !isPaused;
      toggleButton.setAttribute("aria-label", isPaused ? "play music" : "pause music");

      if (!hasEntered && audioPlayer.paused) {
        statusText.textContent = "คลิกเพื่อเข้าและเปิดเพลง";
        return;
      }

      statusText.textContent = "";
    }

    previousButton.addEventListener("click", previousMusic);
    toggleButton.addEventListener("click", toggleMusic);
    stopButton.addEventListener("click", stopMusic);
    nextButton.addEventListener("click", nextMusic);
    volumeControl.addEventListener("input", () => {
      audioPlayer.volume = getVolume();
    });

    enterScreen.addEventListener("click", () => {
      playMusic();
    });

    document.addEventListener("pointerdown", () => {
      if (!hasEntered) {
        playMusic();
      }
    }, { once: true });

    audioPlayer.addEventListener("loadedmetadata", updateProgress);
    audioPlayer.addEventListener("timeupdate", updateProgress);
    audioPlayer.addEventListener("play", updateStatus);
    audioPlayer.addEventListener("pause", updateStatus);
    audioPlayer.addEventListener("ended", nextMusic);

    document.addEventListener("contextmenu", (event) => {
      event.preventDefault();
    });

    function blockInspectShortcuts(event) {
      const key = event.key.toLowerCase();
      const code = event.code;
      const ctrlOrMeta = event.ctrlKey || event.metaKey;
      const blockedShortcut =
        event.key === "F12" ||
        (ctrlOrMeta && event.shiftKey && ["i", "j", "c"].includes(key)) ||
        (ctrlOrMeta && event.shiftKey && ["KeyI", "KeyJ", "KeyC"].includes(code)) ||
        (ctrlOrMeta && (key === "u" || code === "KeyU"));

      if (blockedShortcut) {
        event.preventDefault();
        event.stopPropagation();
        event.stopImmediatePropagation();
        return false;
      }
    }

    ["keydown", "keypress", "keyup"].forEach((eventName) => {
      window.addEventListener(eventName, blockInspectShortcuts, true);
      document.addEventListener(eventName, blockInspectShortcuts, true);
    });

    window.addEventListener("load", () => {
      loadTrack(trackIndex);
    });
  </script>
</body>
</html>
